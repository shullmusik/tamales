<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haz tu pedido</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css?v=3.1.0">
<style>
  /* Página para clientes: el menú viene en el enlace (#…), el pedido sale por WhatsApp. */
  body{padding-bottom:120px}
  .menu{max-width:560px;margin:0 auto;padding:14px}
  .hero{background:linear-gradient(135deg,var(--maiz),var(--maiz-dark));color:#fff;padding:22px 18px 18px;border-radius:0 0 26px 26px}
  .hero h1{margin:0;font-size:26px;font-weight:850;letter-spacing:-.4px}
  .hero p{margin:6px 0 0;font-size:14px;opacity:.92}
  .mitem{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .mitem__emoji{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:25px;border-radius:14px;background:var(--maiz-soft)}
  .mitem__body{flex:1;min-width:0}
  .mitem__name{display:block;font-size:15.5px;font-weight:750}
  .mitem__price{display:block;font-size:13px;color:var(--tinta-2)}
  .mitem__qty{display:flex;align-items:center;gap:4px}
  .mitem__qty .step{width:46px;height:46px;font-size:24px;border-radius:14px}
  .mitem__qty .step__num{width:52px;height:46px;font-size:22px}
  .cta{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--linea);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .cta__in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .cta__sum{flex:1;font-size:14px;color:var(--tinta-2)}
  .cta__sum b{display:block;font-size:20px;color:var(--tinta)}
  .cta .btn{flex:none}
  .err{padding:40px 20px;text-align:center;color:var(--tinta-2)}
</style>
</head>
<body>
<div class="hero"><h1 id="biz">Cargando el menú…</h1><p id="days"></p></div>
<main class="menu" id="menu"></main>

<div class="cta" id="cta" hidden>
  <div class="cta__in">
    <div class="cta__sum"><span id="sumPieces">0 piezas</span><b id="sumTotal">$0.00</b></div>
    <button class="btn btn--wa" id="send">Enviar pedido por WhatsApp</button>
  </div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var money = function (c) { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(c / 100); };
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

  var data = null;
  try {
    var b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    data = JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch (e) { data = null; }
  if (!data || !data.p || !data.p.length) {
    $('#biz').textContent = 'Menú no disponible';
    $('#menu').innerHTML = '<p class="err">Este enlace no trae el menú. Pide uno nuevo a quien te lo compartió.</p>';
    return;
  }

  $('#biz').textContent = data.b;
  var sellDays = data.d || [];
  $('#days').textContent = sellDays.length ? 'Entregamos ' + (sellDays.length === 1 ? 'los ' + DIAS[sellDays[0]] + 's' : sellDays.map(function (d) { return DIAS[d]; }).join(', ')) + '. Arma tu pedido y mándalo por WhatsApp.' : 'Arma tu pedido y mándalo por WhatsApp.';

  var qty = {};
  var cats = (data.c || []).slice(); if (!cats.some(function (c) { return c[0] === 'otros'; })) cats.push(['otros', '🍽️', 'Otros']);
  var html = '';
  cats.forEach(function (c) {
    var items = data.p.filter(function (p) { return (p[3] || 'otros') === c[0]; });
    if (!items.length) return;
    html += '<h2 class="group-title"><span>' + c[1] + '</span> ' + esc(c[2]) + '</h2><div class="cards">';
    items.forEach(function (p) {
      var i = data.p.indexOf(p);
      html += '<article class="card"><div class="mitem"><span class="mitem__emoji">' + esc(p[0]) + '</span><span class="mitem__body"><span class="mitem__name">' + esc(p[1]) + '</span><span class="mitem__price">' + money(p[2]) + ' c/u</span></span>' +
        '<span class="mitem__qty"><button type="button" class="step" data-dec="' + i + '" aria-label="Menos">−</button><input class="step__num" type="number" inputmode="numeric" min="0" value="0" data-q="' + i + '" aria-label="Cantidad"><button type="button" class="step" data-inc="' + i + '" aria-label="Más">+</button></span></div></article>';
    });
    html += '</div>';
  });

  // nextSell: primer día de venta a partir de mañana
  var d = new Date(); d.setDate(d.getDate() + 1);
  var n = 0; while (sellDays.length && sellDays.indexOf(d.getDay()) < 0 && n++ < 7) d.setDate(d.getDate() + 1);
  var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  html += '<h2 class="group-title"><span>🧾</span> Tus datos</h2><div class="card" style="padding:14px">' +
    '<label class="field"><span class="field__label">Tu nombre</span><input class="field__input" id="name" type="text" maxlength="40" autocomplete="name" placeholder="¿Cómo te llamas?"></label>' +
    '<label class="field"><span class="field__label">Tu WhatsApp (opcional, para avisarte)</span><input class="field__input" id="phone" type="tel" inputmode="tel" maxlength="20" placeholder="55 1234 5678"></label>' +
    '<div class="field-pair"><label class="field"><span class="field__label">Día que recoges</span><input class="field__input" id="date" type="date" value="' + iso + '"></label>' +
    '<label class="field"><span class="field__label">Hora</span><input class="field__input" id="time" type="time" value="10:00"></label></div>' +
    '<p class="hint" id="dateHint"></p>' +
    '<label class="field"><span class="field__label">Nota (opcional)</span><input class="field__input" id="note" type="text" maxlength="120" placeholder="sin cebolla, para llevar…"></label></div>';
  $('#menu').innerHTML = html;
  $('#cta').hidden = false;

  function sum() {
    var pieces = 0, total = 0;
    Object.keys(qty).forEach(function (i) { pieces += qty[i]; total += qty[i] * data.p[i][2]; });
    $('#sumPieces').textContent = pieces + (pieces === 1 ? ' pieza' : ' piezas');
    $('#sumTotal').textContent = money(total);
    return { pieces: pieces, total: total };
  }
  function set(i, v) { qty[i] = Math.max(0, Math.round(v) || 0); var inp = document.querySelector('[data-q="' + i + '"]'); if (inp) inp.value = qty[i]; sum(); }
  function checkDate() {
    var v = $('#date').value; if (!v || !sellDays.length) { $('#dateHint').textContent = ''; return true; }
    var p = v.split('-'); var day = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
    var ok = sellDays.indexOf(day) >= 0;
    $('#dateHint').textContent = ok ? '' : '⚠️ Ese día no hay entregas; entregamos ' + (sellDays.length === 1 ? 'los ' + DIAS[sellDays[0]] + 's' : sellDays.map(function (x) { return DIAS[x]; }).join(', ')) + '.';
    return ok;
  }
  document.addEventListener('click', function (ev) {
    var inc = ev.target.closest('[data-inc]'), dec = ev.target.closest('[data-dec]');
    if (inc) set(inc.dataset.inc, (qty[inc.dataset.inc] || 0) + 1);
    if (dec) set(dec.dataset.dec, (qty[dec.dataset.dec] || 0) - 1);
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.dataset && ev.target.dataset.q != null) set(ev.target.dataset.q, Number(ev.target.value));
    if (ev.target.id === 'date') checkDate();
  });
  checkDate();

  $('#send').addEventListener('click', function () {
    var s = sum();
    if (!s.pieces) { alert('Elige al menos un producto'); return; }
    var name = $('#name').value.trim(); if (!name) { alert('Escribe tu nombre'); $('#name').focus(); return; }
    if (!checkDate() && !confirm('Ese día no hay entregas. ¿Mandar el pedido de todos modos?')) return;
    var lines = ['Pedido para ' + data.b, 'Nombre: ' + name];
    if ($('#phone').value.trim()) lines.push('Tel: ' + $('#phone').value.trim());
    lines.push('Recoger: ' + $('#date').value + ($('#time').value ? ' ' + $('#time').value : ''));
    Object.keys(qty).forEach(function (i) { if (qty[i] > 0) lines.push('- ' + qty[i] + ' x ' + data.p[i][1] + ' (' + money(qty[i] * data.p[i][2]) + ')'); });
    lines.push('Total: ' + money(s.total));
    if ($('#note').value.trim()) lines.push('Nota: ' + $('#note').value.trim());
    location.href = 'https://wa.me/' + (data.t || '') + '?text=' + encodeURIComponent(lines.join('\n'));
  });
})();
</script>
</body>
</html>
