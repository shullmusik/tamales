plugins {
    id 'com.android.application'
}

// La firma llega por variables de entorno desde GitHub Actions (ver .github/workflows/android.yml).
def ksFile = System.getenv('KEYSTORE_FILE')
def ksPass = System.getenv('KEYSTORE_PASSWORD')
def hasKeystore = ksFile != null && ksPass != null && file(ksFile).exists()

/* ---------------------------------------------------------------------------
   La web (index.html, css/, js/, icons/, manifest) se copia DENTRO del APK en
   assets/www en cada compilación: una sola base de código, app independiente.
   sw.js se excluye a propósito: dentro del WebView no hace falta service worker.
   --------------------------------------------------------------------------- */
def webRoot = rootProject.projectDir.parentFile
def webAssets = file("$projectDir/src/main/assets/www")

tasks.register('copyWeb', Copy) {
    description = 'Empaqueta la web dentro del APK (assets/www)'
    doFirst { delete webAssets }
    from(webRoot) {
        include 'index.html', 'pedido.html', 'manifest.webmanifest', 'css/**', 'js/**', 'icons/**'
    }
    into webAssets
}
afterEvaluate { tasks.named('preBuild') { dependsOn 'copyWeb' } }

android {
    namespace 'io.github.shullmusik.tamalitos'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.shullmusik.tamalitos'
        minSdk 23
        targetSdk 35
        versionCode (project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1)
        versionName (project.hasProperty('versionName') ? project.versionName : '2.4.0')
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias System.getenv('KEY_ALIAS') ?: 'tamalitos'
                keyPassword System.getenv('KEY_PASSWORD') ?: ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader: sirve assets/www bajo https://appassets.androidplatform.net (origen seguro).
    implementation 'androidx.webkit:webkit:1.14.0'
    // FileProvider: entrega a la cámara la ruta donde guardar la foto del ticket.
    implementation 'androidx.core:core:1.13.1'
}
